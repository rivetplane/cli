name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run client:package:verify
      - uses: actions/checkout@v6
        with:
          repository: rivetplane/typescript-sdk
          ref: f6110c758081899ffa5ddbc2f9a8a73d3ca4e9d3
          path: sdk-source
      - name: Build the API CLI SDK dependency
        run: |
          npm ci --prefix sdk-source
          npm pack ./sdk-source --pack-destination /tmp
          npm install --prefix packages/api-cli --no-save /tmp/rivetplane-sdk-0.1.0.tgz typescript@5.9 @types/node@22
      - name: Check and test the API CLI
        run: |
          npm run --prefix packages/api-cli typecheck
          npm test --prefix packages/api-cli
          npm pack ./packages/api-cli --pack-destination /tmp
      - name: Test the API CLI package in a clean directory
        run: |
          TEST_DIR=$(mktemp -d)
          npm install --prefix "$TEST_DIR" /tmp/rivetplane-sdk-0.1.0.tgz /tmp/rivetplane-api-cli-0.1.0.tgz
          "$TEST_DIR/node_modules/.bin/rivetplane-api" --version
          "$TEST_DIR/node_modules/.bin/rivetplane-api" --help
