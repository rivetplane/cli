name: Publish Rivetplane API CLI to npm

on:
  push:
    tags:
      - "api-cli-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Install an npm CLI that supports trusted publishing
        run: npm install --global npm@11.17.0
      - name: Install API CLI dependencies
        run: npm install --prefix packages/api-cli
      - name: Check tag and package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/api-cli/package.json').version")
          test "${GITHUB_REF_NAME}" = "api-cli-v${PACKAGE_VERSION}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Type-check and test
        run: |
          npm run --prefix packages/api-cli typecheck
          npm test --prefix packages/api-cli
      - name: Inspect the package tarball
        run: npm pack ./packages/api-cli --dry-run
      - name: Reject a duplicate version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/api-cli/package.json').version")
          if npm view "@rivetplane/api-cli@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@rivetplane/api-cli@${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi
      - name: Publish with provenance
        working-directory: packages/api-cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
