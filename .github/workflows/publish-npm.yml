name: Publish Rivetplane to npm

on:
  push:
    tags:
      - "rivetplane-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install an npm CLI that supports trusted publishing
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check tag and package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/client/package.json').version")
          test "${GITHUB_REF_NAME}" = "rivetplane-v${PACKAGE_VERSION}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Type-check and test
        run: |
          bun run typecheck
          bun run test
      - name: Inspect and test the package tarball
        run: bun run client:package:verify
      - name: Reject a duplicate version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/client/package.json').version")
          if npm view "rivetplane@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "rivetplane@${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi
      - name: Publish with provenance
        working-directory: packages/client
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
